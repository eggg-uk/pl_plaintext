<html>
    <body>
        <div style = "display:flex; gap:20px;">
            <div id="pastFixtures" style="flex: 1"></div>
            <div id="currentFixtures" style="flex: 1"></div>
            <div id="futureFixtures" style="flex: 1"></div>
        </div>
        <script>
            fetch('output.txt')
                .then(response => response.text())
                .then(data => {
                    const lines = data.split('\n')
                    console.log(lines[0])
                    const sections = {
                        past: {header: 'Past week: Gameweek', line: -1},
                        last: {header: 'Last week: Gameweek', line: -1},
                        current: { header: 'This week: Gameweek', line: -1 },
                        next: { header: 'Next week: Gameweek', line: -1 },
                        future: { header: 'Future week: Gameweek', line: -1 }
                    };
                    let currentSection = null;
                    for (let i = 0; i< lines.length; i++){
                        for (const [key,section] of Object.entries(sections)){
                            if(lines[i].includes(section.header) && section.line < 0){
                                sections[key].line = i;
                                break;
                            }
                        }
                    }
                    console.log(sections)
                    const pastWeekLines = lines.slice(sections.past.line,sections.current.line);
                    const currentAndNextWeekLines = lines.slice(sections.current.line,sections.future.line);
                    const futureWeekLines = lines.slice(sections.future.line,lines.length);
                    console.log(currentAndNextWeekLines);

                    document.getElementById('pastFixtures').innerHTML = pastWeekLines.join('<br>');
                    document.getElementById('currentFixtures').innerHTML = currentAndNextWeekLines.join('<br>');
                    document.getElementById('futureFixtures').innerHTML = futureWeekLines.join('<br>');
                });
        </script>

    </body>
</html>
